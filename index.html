 능력치와 보통 수준의 피해량을 가진 돌격소총입니다.","weapon:10:description:ko":"준수한 피해량을 갖추고 있으며, 신속한 대응에 적합한 정찰형 저격소총입니다.","weapon:11:description:ko":"빠른 방아쇠 조작이 가능하며, 중거리부터 장거리까지 효과적인 반자동 지정사수소총입니다.","weapon:12:description:ko":"피해량과 반동이 매우 높은 반자동 대구경 저격소총입니다.","weapon:13:description:ko":"근거리에서 벽이나 장애물을 파괴하는 데 효과적인 휴대용 유탄발사기입니다.","weapon:14:description:ko":"근거리부터 중거리까지 사용하는 유탄발사기입니다.","weapon:15:description:ko":"높은 연사력과 강한 반동을 가진 점사식 돌격소총입니다.","weapon:16:description:ko":"가볍고 균형 잡힌 성능을 갖춘 기관단총입니다.","weapon:17:description:ko":"강력한 피해량과 파괴력을 갖추고 있으며, 탄약 보유량이 많은 경기관총입니다.","weapon:18:description:ko":"높은 명중률과 긴 사거리를 갖춘 돌격소총입니다.","weapon:19:description:ko":"가볍고 연사력과 반동이 높지만, 지향 사격 명중률이 우수한 기관단총입니다.","weapon:20:description:ko":"높은 피해량과 강한 반동을 가진 돌격소총입니다.","weapon:21:description:ko":"연사력은 낮지만 피해량과 반동 제어 성능이 준수한 돌격소총입니다.","weapon:22:description:ko":"매우 많은 탄약과 강력한 파괴력을 갖춘 대형 경기관총으로, 반동이 강합니다.","weapon:23:description:ko":"낮은 피해량과 반동, 높은 연사력을 가진 기관단총입니다.","weapon:24:description:ko":"탄약 보유량이 많고, 지향 사격 명중률과 이동 중 총기 안정성이 준수한 기관단총입니다.","weapon:25:description:ko":"장거리에 특화된 단발식 돌격소총입니다. 유탄발사기를 장착할 수 있습니다.","weapon:26:description:ko":"연사력은 낮지만 피해량이 높은 전투소총입니다. 방탄 유리를 장착할 수 있습니다.","weapon:27:description:ko":"신속한 대응에 적합한 경량 돌격소총입니다. 드럼 탄창을 장착할 수 있습니다.","weapon:28:description:ko":"반동이 준수하지만 탄약 보유량이 적은 경기관총입니다. 금속 방패를 장착할 수 있습니다.","weapon:29:description:ko":"높은 피해량과 균형 잡힌 성능을 갖춘 리볼버입니다.","weapon:30:description:ko":"탄약 보유량이 많고 피해량과 반동이 낮은 정찰형 권총입니다.","weapon:31:description:ko":"탄창 용량이 크고 피해량과 반동이 낮지만 연사력이 높은 경찰용 권총입니다. 스위치를 장착할 수 있습니다.","weapon:32:description:ko":"높은 피해량을 가진 대구경 권총으로, 탄약이 적고 반동이 강합니다.","weapon:33:description:ko":"전반적으로 균형 잡힌 성능을 갖춘 권총입니다.","weapon:34:description:ko":"산탄을 발사하는 리볼버로, 구멍을 뚫는 데 효과적입니다.","weapon:35:description:ko":"연사력이 높고 반동이 낮은 자동 권총입니다.","weapon:36:description:ko":"피해량과 탄창 용량이 준수한 권총으로, 방탄 물체에 더 높은 피해를 줍니다.","weapon:37:description:ko":"반동과 피해량이 매우 높지만 조작 속도가 느린 대구경 리볼버입니다.","weapon:38:description:ko":"피해량이 보통 수준이고 탄창 용량이 작은 체코군 자동 기관권총입니다.","weapon:39:description:ko":"탄약 보유량이 많지 function sortedParts(ps){const mode=$('part-sort').value;return ps.sort((a,b)=>mode==='az'?byName(a,b):mode==='za'?-byName(a,b):mode==='slot'?slotName(a.slot).localeCompare(slotName(b.slot))||byName(a,b):(a.display_order||999)-(b.display_order||999)||byName(a,b))}
function setLanguage(lang){state.lang=lang;document.documentElement.lang=lang;for(const e of document.querySelectorAll('[data-i]'))e.textContent=t(e.dataset.i);$('search').placeholder=t('search');$('en').classList.toggle('active',lang==='en');$('ko').classList.toggle('active',lang==='ko');renderList();render()}
function renderList(){const q=$('search').value.toLocaleLowerCase();const list=sortedWeapons(DATA.weapons.filter(w=>w.weapon_type===state.type&&(name(w)+' '+desc(w)).toLocaleLowerCase().includes(q)));$('weapon-list').replaceChildren();for(const w of list){const b=document.createElement('button');b.className='weapon-item'+(state.weapon?.id===w.id?' active':'');const n=document.createElement('strong');n.textContent=name(w);const cat=document.createElement('small');cat.textContent=category(w);b.append(n,cat);b.onclick=()=>selectWeapon(w.id);$('weapon-list').append(b)}if(!list.length)$('weapon-list').textContent=t('noResults')}
function selectWeapon(id){if(state.weapon?.id!==id)state.equipped={};state.weapon=DATA.weapons.find(w=>w.id===id);renderList();render()}
function rulesFor(id,slot){return DATA.attachment_dependencies.filter(r=>r.weapon_id===state.weapon.id&&(r.target_attachment_id===id||(r.target_attachment_id==null&&r.target_slot===slot)))}
function missing(id,slot,equipped=state.equipped){return rulesFor(id,slot).filter(r=>!Object.values(equipped).includes(r.required_attachment_id))}
function equip(slot,id){const next={...state.equipped};if(id)next[slot]=id;else delete next[slot];if(id&&missing(id,slot,next).length){renderSlots();return}let changed=true;while(changed){changed=false;for(const [sl,pid] of Object.entries(next))if(missing(pid,sl,next).length){delete next[sl];changed=true}}state.equipped=next;render()}
function render(){const w=state.weapon;if(!w)return;$('weapon-name').textContent=name(w);$('weapon-desc').textContent=desc(w)||t('noDesc');$('category').textContent=category(w);const fields=[[t('damage'),w.damage],['RPM',w.rpm],[t('range'),w.range_value],[t('recoil'),grade(w.recoil_grade)],[t('ammo'),fmt(w.magazine)+' / '+fmt(w.reserve_ammo)],[t('damageGrade'),grade(w.damage_grade)],[t('weight'),grade(w.weight_grade,true)]];$('stats').replaceChildren();for(const [label,value] of fields){const div=document.createElement('div');div.className='stat';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=fmt(value);div.append(small,strong);$('stats').append(div)}renderSlots();renderEffects()}
function renderSlots(){const ids=new Set(DATA.compatibility.filter(c=>c.weapon_id===state.weapon.id).map(c=>c.attachment_id));const groups=new Map();for(const p of sortedParts(DATA.attachments.filter(p=>ids.has(p.id)))){if(!groups.has(p.slot))groups.set(p.slot,[]);groups.get(p.slot).push(p)}$('slots').replaceChildren();if(!groups.size){$('slots').textContent=t('noParts');return}for(const [slot,parts] of groups){const box=document.createElement('div');box.className='slot';const label=document.createElement('label');label.textContent=slotName(slot)+' ('+parts.length+' '+t('count')+')';const sel=document.createElement('select');sel.setAttribute('aria-label',slotName(slot));sel.add(new Option(t('none'),''));let available=0;const needed=new Set();for(const p of parts){const req=missing(p.id,slot).map(r=>name(findPart(r.required_attachment_id))||String(r.required_attachment_id));const opt=new Option(name(p)+(p.magnification!=null?' · '+p.magnification+'×':'')+(req.length?' ('+t('requires')+': '+req.join(', ')+')':''),String(p.id));opt.disabled=req.length>0;if(req.length)req.forEach(n=>needed.add(n));else available++;sel.add(opt)}sel.value=state.equipped[slot]?String(state.equipped[slot]):'';sel.disabled=!available;sel.onchange=()=>equip(slot,sel.value?Number(sel.value):null);box.append(label,sel);if(needed.size){const hint=document.createElement('small');hint.textContent=t('locked')+': '+[...needed].join(', ');box.append(hint)}$('slots').append(box)}}
function addEffect(label,value){const row=document.createElement('div');row.className='effect-row';const b=document.createElement('b');b.textContent=label+': ';row.append(b,document.createTextNode(value));$('effects-list').append(row)}
function effectName(key){return EFFECT[key]?.[state.lang==='ko'?1:0]||key}
function hasMagInDesc(s){return /(?:magnification\s*[:：]\s*[\d.]+|배율\s*[:：]\s*[\d.]+\s*배?)/i.test(s)}
function renderEffects(){const w=state.weapon,parts=selected();$('effects-list').replaceChildren();$('descriptions-list').replaceChildren();const totals={},ammo=[w.magazine,w.reserve_ammo];let mag=null,override=null;for(const p of parts){for(const e of DATA.attachment_effects.filter(e=>e.attachment_id===p.id)){const v=Number(e.effect_value);if(e.effect_key==='magazine_override')ammo[0]=v;else if(e.effect_key==='reserve_override')ammo[1]=v;else if(e.effect_key==='fire_rate_override')override=v;else totals[e.effect_key]=(totals[e.effect_key]||0)+v}if(p.slot==='Scope'&&p.magnification!=null)mag=p.magnification;const item=document.createElement('div');item.className='description';const title=document.createElement('strong');title.textContent=slotName(p.slot)+' · '+name(p);const paragraph=document.createElement('p');let description=desc(p)||'';if(p.magnification!=null&&!hasMagInDesc(description))description+=(description?'\n':'')+(state.lang==='ko'?'배율: '+p.magnification+'배':'Magnification: x'+p.magnification);paragraph.textContent=description||t('noDesc');item.append(title,paragraph);for(const e of DATA.attachment_special_effects.filter(e=>e.attachment_id===p.id).sort((a,b)=>a.sort_order-b.sort_order||a.id-b.id)){const line=document.createElement('p');line.textContent='• '+local('special_effect',e.id,'description',e.description);item.append(line)}$('descriptions-list').append(item)}addEffect(t('ammoEffect'),fmt(w.magazine)+' / '+fmt(w.reserve_ammo)+' → '+fmt(ammo[0])+' / '+fmt(ammo[1]));if(mag!=null)addEffect(t('magnification'),mag+'×');for(const [key,value] of Object.entries(totals)){if(key==='fire_rate'&&override!==null)continue;const base={damage_multiplier:w.damage,range_multiplier:w.range_value,fire_rate:w.rpm}[key];const sign=value>=0?'+':'';if(base!=null&&['damage_multiplier','range_multiplier','fire_rate'].includes(key))addEffect(effectName(key),fmt(base)+' → '+fmt(Math.round(base*(1+value/100)*100)/100)+' ('+sign+value+'%, '+t('approx')+')');else addEffect(effectName(key),sign+value+'% ('+t('sum')+')')}if(override!==null)addEffect(effectName('fire_rate_override'),fmt(w.rpm)+' → '+override+' RPM');for(const p of parts)for(const e of DATA.attachment_special_effects.filter(e=>e.attachment_id===p.id))addEffect(t('special')+' · '+name(p),local('special_effect',e.id,'description',e.description));if(!parts.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('noEquipped');$('descriptions-list').append(empty)}}
$('en').onclick=()=>setLanguage('en');$('ko').onclick=()=>setLanguage('ko');$('search').oninput=renderList;$('weapon-sort').onchange=renderList;$('part-sort').onchange=renderSlots;$('reset').onclick=()=>{state.equipped={};render()};for(const [id,type] of [['primary','주무기'],['secondary','보조무기']])$(id).onclick=()=>{state.type=type;state.equipped={};$('search').value='';$('primary').classList.toggle('active',type==='주무기');$('secondary').classList.toggle('active',type==='보조무기');const first=sortedWeapons(DATA.weapons.filter(w=>w.weapon_type===type))[0];state.weapon=first||null;renderList();render()};state.weapon=sortedWeapons(DATA.weapons.filter(w=>w.weapon_type===state.type))[0];setLanguage('en');
</script></body></html>
